[project]
name = "aai-500-final-team-project"
version = "0.1.0"
description = "AAI-500 Final Team Project"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.13",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "pypdf>=6.13.2",
]

[tool.ruff.lint]
# E402: module-level import not at top of file — expected in notebooks where
# warnings.filterwarnings('ignore') intentionally precedes other imports
ignore = ["E402"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.4",
    "ipykernel>=7.2.0",
]
